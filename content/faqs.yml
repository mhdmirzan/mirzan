list:
- label: "What services do you offer?"
  content: "I offer beginner to intermediate-level support in data engineering (ETL pipelines, data cleaning, SQL queries), AI/ML (model development, EDA, preprocessing), and cloud-based solutions using AWS (S3, Redshift, SageMaker). I also work with Snowflake for modern data warehousing tasks. I'm open to freelance tasks, collaborations, and learning-focused projects."

- label: "What AI Engineering services do you provide?"
  content: "I build custom AI solutions, fine-tune machine learning models, integrate Large Language Model (LLM) APIs, automate intelligent workflows, and develop AI-driven features using Python, PyTorch/Scikit-Learn, and cloud AI services."

- label: "What is your typical development process and how are clients involved?"
  content: "My workflow starts with understanding the problem, identifying goals, and gathering relevant data. Then I design and build the required pipelines or models, regularly sharing progress for feedback. I encourage client involvement at every step to make sure the solution meets their expectations."

- label: "How do you handle Data Engineering and ETL pipelines?"
  content: "I design, build, and optimize scalable data pipelines (ETL/ELT), perform automated data cleaning and transformations, configure data warehouses using Snowflake and AWS (S3, Redshift), and construct reliable SQL workflows."

- label: "What Data Analytics and Business Intelligence solutions do you offer?"
  content: "I create interactive analytics dashboards in Power BI, conduct deep exploratory data analysis (EDA), extract actionable insights from complex datasets, and build customized analytical reporting tools for data-driven decisions."

- label: "What Web Development technologies do you use for building web applications?"
  content: "I build fast, modern, and responsive web applications using Nuxt.js, Vue.js, JavaScript/TypeScript, TailwindCSS, RESTful APIs, and backend services, focusing on high performance, clean UI, and optimized SEO."

- label: "Can you integrate Data Pipelines, AI models, and Web Applications together?"
  content: "Yes. I specialize in building end-to-end solutions—connecting raw data pipelines to machine learning/AI inference APIs and seamlessly embedding them into user-facing web applications."

- label: "Do you work on both new builds and existing codebase maintenance?"
  content: "Yes. I support both new projects from scratch and existing codebases. I can help refine data pipelines, debug web application features, upgrade AI models, or improve overall system performance."

- label: "How do we get started on a project?"
  content: "Simply reach out via the Contact page or email with your project details. We will schedule a brief technical intro to discuss your goals, requirements, timeline, and deliverables."
