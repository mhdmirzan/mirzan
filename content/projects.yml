  - id: 13
    title: "EcoRide Urban Analytics"
    description: "A deep-dive SQL optimization project utilizing Google BigQuery to analyze 15,000+ e-bike transactions. The analysis focuses on solving urban mobility challenges, such as fleet rebalancing and user retention, by transforming raw rental logs into actionable operational intelligence and strategic growth recommendations."
    longDescription: "This project serves as a comprehensive analytical framework for a modern e-bike sharing service. Using a dataset spanning 12 months, I engineered complex SQL queries to evaluate system health across three core dimensions: user behavior, station logistics, and temporal demand. The analysis goes beyond simple reporting by identifying critical 'false starts' and outliers, mapping the geographic 'net flow' of bikes to prevent station stock-outs, and calculating Month-over-Month (MoM) growth metrics to track market penetration. By segmenting users into Subscriber and Casual tiers, the project uncovers distinct usage patterns that allow for targeted marketing and dynamic pricing strategies."
    image: "/img/projects/ebike-analytics.png"
    technologies:
      - "Google BigQuery"
      - "SQL"
      - "Time-Series Analysis"
      - "Statistical Analysis"
    category: "Data Analytics"
    featured: false
    status: "completed"
    startDate: "2026-01-10"
    endDate: "2026-03-05"
    links:
      case_study: "https://docs.google.com/document/d/10yNcasM6IC5UicCFz6Fjka5y9y-q8GMv5St5x3KLioA/edit?usp=sharing"
    features:
      - "Operational Net-Flow Mapping: Developed a multi-CTE logic to track the movement of bikes between 25 stations, revealing a critical deficit in 12 locations requiring manual rebalancing."
      - "Temporal Peak Analysis: Aggregated 15,000+ rows of time-series data to identify high-revenue windows, specifically pinpointing 3:00 PM-4:00 PM as the daily peak for fleet utilization."
      - "User Segmentation Logic: Built a categorization engine to distinguish between short-burst commuters and long-duration leisure riders, enabling personalized membership offers."
      - "Data Integrity Audit: Engineered automated COUNTIF scripts to detect and isolate 'false starts' (trips < 2 mins) and zero-distance anomalies to ensure statistical accuracy."
      - "Growth & Retention Tracking: Implemented LAG() and LEAD() window functions to visualize user acquisition trends, identifying a massive 219.2% growth spike in Q1."
    challenges:
      - "Anomalous Data Filtering: Resolved the issue of 'ghost rides' (0km distance) which initially skewed average duration metrics, ensuring the final report reflected real-world usage."
      - "Relational Data Consolidation: Successfully joined disparate User, Ride, and Station tables to create a unified view of the ecosystem without compromising query performance."
      - "Calculating Net Displacement: Solved the logical hurdle of comparing departures vs. arrivals per station to highlight logistics bottlenecks in the city center."
    outcomes:
      - "Targeted Revenue Strategy: Discovered that weekends are underutilized, leading to a recommendation for 'Leisure Pass' discounts to boost non-commuter revenue."
      - "Improved Logistics Efficiency: Provided a roadmap for fleet operators to prioritize the 12 negative-flow stations during the 7:00 AM morning rush."
      - "Data-Driven Decision Making: Transformed raw timestamps and coordinates into a high-level executive summary of urban mobility trends."

