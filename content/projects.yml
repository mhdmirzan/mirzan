  - id: 14
    title: "Agent Orchestra"
    description: "A fully autonomous, multi-agent AI research system built with LangChain and Streamlit. It orchestrates four specialized AI agents to search the web, scrape deep content, draft comprehensive markdown reports, and provide automated critiques in a highly polished, live-updating frontend."
    longDescription: "Agent Orchestra is an advanced AI application that transforms complex, manual research into a seamless, automated pipeline. The system architecture leverages LangChain to coordinate four distinct LLM agents: a Search Agent using the Tavily API to find reliable sources, a Reader Agent to scrape and extract dense contexts from HTML, a Writer Chain to synthesize the data into a structured report, and a Critic Chain to review and score the output. The backend is paired with a highly customized Streamlit frontend, featuring bespoke CSS, a responsive layout, and asynchronous state management that provides users with live, step-by-step progress tracking and a downloadable final report."
    image: "/img/projects/agent-orchestra.png"
    technologies:
      - "Python"
      - "Streamlit"
      - "LangChain"
      - "OpenAI API"
      - "Tavily Search API"
      - "BeautifulSoup4"
    category: "AI"
    featured: true
    status: "completed"
    startDate: "2026-03-15"
    endDate: "2026-04-21"
    links:
      demo: "https://agentorchestra.streamlit.app/"
      github: "https://github.com/mhdmirzan/multi-agent-system"
      case_study: "/blog/5-agent-orchestra"
    features:
      - "Four-Stage Autonomous Pipeline: Engineered a sequential orchestration graph where output from the Search and Reader tools is deterministically piped into the Writer and Critic LLMs."
      - "Live UI State Management: Utilized Streamlit's session states and empty placeholder containers to build a responsive pipeline visualizer that updates asynchronously as each agent completes its task."
      - "Intelligent Web Scraping: Integrated custom Python tools using BeautifulSoup and Requests to intelligently extract meaningful text from raw HTML while bypassing web clutter."
      - "Feedback & Self-Critique Loop: Implemented an automated AI critic step that evaluates the drafted report for accuracy, tone, and depth, acting as a built-in quality assurance measure."
      - "Fully Customized UI/UX: Overrode Streamlit's default Chrome with extensive CSS injections to create a modern, sleek interface featuring custom input cards, progress indicators, and dynamic step-status styling."
    challenges:
      - "Asynchronous UI Rendering: Overcame Streamlit's synchronous execution constraints by strategically wrapping pipeline rendering functions and managing reruns to show real-time agent progress."
      - "Large Context Coordination: Handled massive tokens of raw scraped data by instructing the Reader agent to synthesize and truncate context before passing it to the Writer chain to prevent context-window exhaustion."
      - "Frontend Component Styling: Bypassed Streamlit's rigid component styling by injecting custom HTML/CSS to perfectly align the hero sections, layout tracking cards, and download buttons to a strict design spec."
    outcomes:
      - "Accelerated Research Workflows: Reduced the time required to gather, read, and synthesize multi-source information from hours down to under 60 seconds."
      - "Production-Ready Full-Stack AI: Demonstrated the ability to bridge complex backend LLM orchestration with a highly polished, consumer-grade frontend."
      - "Reliable Quality Assurance: Ensured high-confidence outputs through the multi-agent approach, where the Critic Agent prevents hallucinations and enforces rigorous scraping targets only relevant domain logic captures actual data over metadata."

