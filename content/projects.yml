  - id: 9
    title: "Customer Segmentation using K-Means Clustering"
    description: "This project focuses on identifying distinct customer personas within a retail dataset to drive targeted marketing strategies. Using an RFM (Recency, Frequency, Monetary) framework, I processed raw transactional data to quantify customer value and engagement. By applying the K-Means Clustering algorithm, I segmented the customer base into actionable groups, such as \"High-Value Loyalists\" and \"At-Risk Customers.\" The analysis includes data preprocessing, optimal cluster selection via the Elbow Method, and visual interpretation of cluster characteristics to provide data-driven business insights."
    longDescription: "This project focuses on identifying distinct customer personas within a retail dataset to drive targeted marketing strategies. Using an RFM (Recency, Frequency, Monetary) framework, I processed raw transactional data to quantify customer value and engagement. By applying the K-Means Clustering algorithm, I segmented the customer base into actionable groups, such as \"High-Value Loyalists\" and \"At-Risk Customers.\" The analysis includes data preprocessing, optimal cluster selection via the Elbow Method, and visual interpretation of cluster characteristics to provide data-driven business insights."
