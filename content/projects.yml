  - id: 10
    title: "Voice Controlled Home Automation System"
    description: "Developed a globally accessible home automation system that integrates ESP32 microcontrollers with the Sinric Pro API to bridge local hardware with the Google Home ecosystem. This project enables seamless voice-activated control and remote monitoring of appliances via the Google Home app, ensuring high availability and low-latency response from anywhere in the world."
    longDescription: "Developed a globally accessible home automation system that integrates ESP32 microcontrollers with the Sinric Pro API to bridge local hardware with the Google Home ecosystem. This project enables seamless voice-activated control and remote monitoring of appliances via the Google Home app, ensuring high availability and low-latency response from anywhere in the world."
    image: "/img/projects/home-automation.png"
    technologies:
      - "C++"
      - "ESP32"
      - "Sinric Pro API"
      - "Google Home/Assistant SDK"
    category: "Hardware & IoT"
    featured: false
    status: "completed"
    startDate: "2023-11-01"
    endDate: "2024-01-20"
    features:
      - "Omnichannel Control: Seamlessly switch between voice commands via Google Assistant and manual toggles through the Google Home mobile app."
      - "Global Accessibility: Cloud-to-cloud integration via Sinric Pro allows for device management from any location with an internet connection."
      - "Real-time State Sync: Bi-directional communication ensures the app UI reflects the actual state of the hardware in real-time."
      - "Modular Architecture: Designed to support multiple relay channels, allowing for the addition of new appliances (lights, fans, pumps) without restructuring the core codebase."
    challenges:
      - "Latency Management: Minimizing the 'command-to-action' delay by optimizing Wi-Fi keep-alive pings and handling asynchronous API requests."
      - "Network Resilience: Implementing auto-reconnect logic to ensure the ESP32 automatically restores its cloud connection after power outages or router reboots."
      - "Secure Authentication: Managing unique App Keys and Secret Keys within the firmware to prevent unauthorized access to the IoT nodes."
      - "Power Stability: Handling the inductive load of relays to prevent electromagnetic interference (EMI) from resetting the ESP32 during switching."
    outcomes:
      - "Cost-Efficient Smart Home: Built a fully functional ecosystem for a fraction of the cost of commercial hubs (e.g., Philips Hue or Samsung SmartThings)."
      - "High Availability: Achieved a stable system uptime with a low-latency response rate for voice-activated tasks."
      - "Hardware-Software Bridge: Successfully demonstrated the integration of embedded C++ firmware with modern cloud-based IoT APIs and consumer-facing smart apps."

